
    <main>
      <section class="card user">
        <div id="auth-controls" class="row">
<a id="login" class="btn primary" href="/login">Sign in with Twitch</a>
          <div id="user-info" class="hide">
            <div>Signed in as <strong id="display-name"></strong></div>
            <a id="logout" class="btn" href="/logout">Logout</a>
          </div>
        </div>
        <div class="balance">Balance: <span id="balance">-</span> 🪨</div>
      </section>

      <section class="card">
        <h2>Heads-up Hand</h2>
        <div class="row">
          <input id="pk-bet" type="number" placeholder="Bet" min="1" />
          <button id="pk-deal" class="btn accent">Deal Hand</button>
        </div>
        <div class="table">
          <div>Board: <span id="pk-board"></span></div>
          <div>You: <span id="pk-player"></span></div>
          <div>Dealer: <span id="pk-dealer"></span></div>
        </div>
        <div id="pk-result" class="result"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
