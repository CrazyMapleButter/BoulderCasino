<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoulderCasino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header>
      <h1>BoulderCasino</h1>
      <p>Gamble your BoulderCoin with style. Slots included.</p>
    </header>

    <main>
      <section class="card user">
        <div id="auth-controls" class="row">
          <button id="login" class="btn primary">Sign in with Twitch</button>
          <div id="user-info" class="hide">
            <div>Signed in as <strong id="display-name"></strong></div>
            <a id="logout" class="btn" href="/logout">Logout</a>
          </div>
        </div>
        <div class="balance">Balance: <span id="balance">-</span> 🪨</div>
      </section>

      <section class="grid">
        <div class="card">
          <h2>Double or Nothing</h2>
          <div class="row">
            <input id="gamble-amount" type="number" placeholder="Amount" min="1" />
            <button id="gamble" class="btn">Gamble</button>
          </div>
          <div id="gamble-result" class="result"></div>
        </div>

        <div class="card slots">
          <h2>Slots</h2>
          <div class="reels" id="reels">
            <div class="reel" id="reel-1"><span>🍒</span></div>
            <div class="reel" id="reel-2"><span>🍋</span></div>
            <div class="reel" id="reel-3"><span>🔔</span></div>
          </div>
          <div class="row">
            <input id="slots-bet" type="number" placeholder="Bet" min="1" />
            <button id="spin" class="btn accent">Spin</button>
          </div>
          <div id="slots-result" class="result"></div>
        </div>
      </section>
    </main>

    <footer>
      <small>All wins/losses update the same BoulderCoin file.</small>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
